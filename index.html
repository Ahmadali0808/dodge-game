<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falling Objects Game</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="libraries/p5.min.js"></script>
  </head>
  <body>
    <div id="game-menu">
      <h1>Welcome to the Game!</h1>
      <button id="start-game">Start Game</button>
    </div>
    <div id="restart-menu" style="display: none; text-align: center;">
      <h1>Game Over</h1>
      <div id="final-score" style="font-size: 24px; margin-bottom: 10px;">Your Score: 0</div>
      <div id="high-score" style="font-size: 24px; margin-bottom: 20px;">High Score: 0</div>
      <button id="restart-game">Restart Game</button>
    </div>
    
    
    <script src="sketch.js"></script>
  </body>
</html>
